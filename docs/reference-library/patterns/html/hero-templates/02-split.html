<!-- ============================================
     Hero Template 2: Split Layout
     Used by: Gamma Catering, Elegant Affairs
     Best for: Showing image + form/CTA side by side
     ============================================ -->

<section class="hero hero--split">
  <div class="hero__visual">
    <img src="hero-image.jpg" alt="Elegant catering setup" />
  </div>
  
  <div class="hero__content">
    <span class="hero__label">Premium Catering Services</span>
    
    <h1 class="hero__headline">
      Crafting Culinary Experiences Since [Year]
    </h1>
    
    <p class="hero__description">
      We specialize in creating memorable dining experiences that 
      reflect your unique vision and style.
    </p>
    
    <!-- Inline quick contact form -->
    <form class="hero__form">
      <input type="text" placeholder="Your Name" />
      <input type="email" placeholder="Email Address" />
      <input type="tel" placeholder="Phone Number" />
      <button type="submit" class="btn btn-primary">
        Get a Quote
      </button>
    </form>
    
    <!-- Trust indicators -->
    <div class="hero__trust">
      <span>✓ 500+ Events Catered</span>
      <span>✓ Award-Winning Chef</span>
    </div>
  </div>
</section>

<!-- CSS Notes:
  - 50/50 split on desktop
  - Image fills left half, content right half
  - Mobile: Stack vertically, image on top
  - Form fields simplified (4 fields max in hero)
-->
