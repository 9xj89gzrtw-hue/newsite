<!-- ============================================
     Hero Template 1: Classic Centered
     Most common pattern - used by ~60% of competitors
     ============================================ -->

<section class="hero hero--centered">
  <div class="hero__background">
    <!-- Video or image background -->
    <img src="hero-bg.jpg" alt="" class="hero__image" />
    <div class="hero__overlay"></div>
  </div>
  
  <div class="hero__content container">
    <h1 class="hero__headline">
      <!-- 5-7 words, compelling value prop -->
      Exceptional Catering for Unforgettable Events
    </h1>
    
    <p class="hero__subheadline">
      <!-- Supporting message, 15-25 words -->
      From intimate gatherings to grand celebrations, we bring culinary 
      excellence and impeccable service to every occasion.
    </p>
    
    <div class="hero__actions">
      <a href="/contact" class="btn btn-primary btn-hero">
        Start Planning Your Event
      </a>
      <a href="/menus" class="btn btn-secondary btn-hero">
        View Our Menus
      </a>
    </div>
  </div>
  
  <!-- Optional: Scroll indicator -->
  <div class="hero__scroll-indicator">
    <span class="scroll-line"></span>
  </div>
</section>

<!-- CSS Notes:
  - Full viewport height (min-height: 100vh)
  - Background with dark overlay for text readability
  - Centered content, max-width on text
  - Responsive: stack buttons on mobile
-->
