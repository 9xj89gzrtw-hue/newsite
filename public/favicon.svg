<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="NILOV CATERING">
  <title>NILOV CATERING</title>
  <!-- c99: векторная фавиконка для сниппета Яндекса (формат SVG рекомендован
       справкой Вебмастера — «120x120 или SVG», ~2 недели на показ в выдаче).
       Упрощённый векторный пересказ круглого бейджа владельца
       (public/brand/logo-round-1024.png): чёрный круг, двойная золотая дуга
       с разрывом на ~4:30 и треугольник вершиной вниз у дуги. Текст бейджа
       («NILOV CATERING / St. Petersburg») не переносим: в фавиконке 16-32px
       он нечитаем, а SVG-текст рендерится системными шрифтами. Палитра —
       как у PNG-иконок (scripts/gen-nilov-icons.py): espresso #0A0908,
       золото бейджа #D4A574. Толщины выбраны под 16px (1 юнит = 0.5px). -->
  <!-- Espresso-фон со скруглением — стиль icon-192/512 (чёрный квадрат + бейдж) -->
  <rect width="32" height="32" rx="7" fill="#0A0908"/>
  <!-- Золотое рамочное кольцо снаружи бейджа (echo icon-192: ring ~0.78 полустороны) -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#D4A574" stroke-width="1.8"/>
  <!-- Двойная дуга эмблемы: сплошная ~280°, разрыв по центру на 4:30
       (dasharray: [C*(280/360), C*(80/360)]; rotate(85) — центр разрыва
       на 135° от верхней точки, как на бейдже владельца) -->
  <g fill="none" stroke="#D4A574" stroke-linecap="round">
    <circle cx="16" cy="16" r="9.2" stroke-width="2.4" stroke-dasharray="44.96 12.85" transform="rotate(85 16 16)"/>
    <circle cx="16" cy="16" r="5.6" stroke-width="1.8" stroke-dasharray="27.37 7.82" transform="rotate(85 16 16)"/>
  </g>
  <!-- Треугольник вершиной вниз — фирменный акцент бейджа, по центру внизу -->
  <path d="M13.8 18.2h4.4L16 21.4z" fill="#D4A574"/>
</svg>
