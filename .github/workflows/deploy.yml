name: Deploy to SpaceWeb (nilovcatering.ru)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nilovcatering
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # c95 (4-W1-A MAJOR-3): SSH-переменные НЕ на уровне job — иначе их видит
    # env каждого шага, включая «bun run build» (утечка SSHPASS в окружение
    # сборки/любой скрипт package.json). Объявлены только в шагах, где нужны:
    # Rsync и Provision.
    env:
      NEXT_PUBLIC_SITE_URL: "https://nilovcatering.ru"
      HOSTING_TARGET: "self-hosted"
      NEXT_PUBLIC_YANDEX_METRIKA_ID: "112532826"
      NEXT_PUBLIC_YANDEX_VERIFICATION: "2dc6d5030c8a432b"
      NEXT_PUBLIC_GOOGLE_VERIFICATION: "owkuVbBpuvmi6CQ_7cv-0lKXqwfJVeDQWwf228DbYho"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile || bun install
        env:
          # Persist Bun's HTTP cache so next/font/google font fetches
          # are cached between CI builds, preventing transient network
          # failures from fonts.googleapis.com.
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/.bun-cache

      - name: Cache Turbo build
        uses: actions/cache@v4
        with:
          path: .next/cache/turbopack
          key: turbo-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build static export
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://nilovcatering.ru"
          HOSTING_TARGET: "self-hosted"
          NEXT_PUBLIC_YANDEX_METRIKA_ID: "112532826"
          NEXT_PUBLIC_YANDEX_VERIFICATION: "2dc6d5030c8a432b"
          NEXT_PUBLIC_GOOGLE_VERIFICATION: "owkuVbBpuvmi6CQ_7cv-0lKXqwfJVeDQWwf228DbYho"

      - name: Verify export
        run: |
          test -f out/index.html || (echo "out/index.html missing"; exit 1)
          echo "Export OK: $(du -sh out | cut -f1)"

      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Rsync to hosting (public_html — the docRoot Apache actually serves)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          attempts=3
          # c95: server-data/ (runtime-состояние: заявки, настройки, rate-limit
          # счётчики) и config/secrets.php (секреты, пишет CI шагом ниже)
          # живут ТОЛЬКО на хостинге — исключены из синхронизации, чтобы
          # rsync --delete никогда их не перезаписал и не удалил.
          for i in $(seq 1 $attempts); do
            echo "::group::Rsync attempt $i/$attempts"
            if sshpass -e rsync -az --delete \
                -e "ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p ${SSH_PORT:-22}" \
                --exclude='.git' --exclude='.github' --exclude='node_modules' \
                --exclude='server-data/*.json' --exclude='server-data/*.lock' --exclude='config/secrets.php' \
                out/ "$SSH_USER@$SSH_HOST:${REMOTE_DIR:-~/nilovcatering.ru/public_html/}"; then
              echo "::endgroup::"
              echo "Rsync OK on attempt $i"
              exit 0
            fi
            rc=$?
            echo "::endgroup::"
            echo "Rsync failed with rc=$rc (attempt $i/$attempts)"
            if [ "$i" -lt "$attempts" ]; then
              echo "Waiting 45s before retry (transient SSH blocks on shared hosting)…"
              sleep 45
            fi
          done
          echo "::error::All $attempts rsync attempts failed (SSH connection issue with hosting)"
          exit 1

      # c95: секреты админки (GH-токен, bcrypt-хэш, HMAC-ключ) существуют
      # ТОЛЬКО на хостинге в config/secrets.php — вне git (.gitignore) и вне
      # rsync (exclude выше). Шаг перезаписывает файл актуальными значениями
      # из GitHub Secrets, поэтому безопасно повторяется на каждом деплое.
      # Паттерн «локальная сборка + rsync» выбран вместо scp/heredoc-через-ssh:
      # у rsync та же семантика удалённого «~», что у основного деплоя, а
      # printf-аргументы не проходят повторный shell-парсинг (важно: bcrypt-хэш
      # содержит $2y$10$… — некавыченный heredoc раскрыл бы $2 как позиционный).
      - name: Provision admin secrets (idempotent)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          SSHPASS: ${{ secrets.SSH_PASS }}
          ADMIN_GH_TOKEN: ${{ secrets.ADMIN_GH_TOKEN }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_HMAC_KEY: ${{ secrets.ADMIN_HMAC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_GH_TOKEN" ] || [ -z "$ADMIN_PASSWORD_HASH" ] || [ -z "$ADMIN_HMAC_KEY" ]; then
            echo "::warning::Какой-то из секретов ADMIN_GH_TOKEN/ADMIN_PASSWORD_HASH/ADMIN_HMAC_KEY пуст — secrets.php будет с пустыми значениями (админка ответит not_configured)"
          fi

          # 1) Каталоги до загрузки (важно при самом первом деплое после c95).
          #    Дефолт \$HOME раскрывается НА ХОСТИНГЕ, а не локально.
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p ${REMOTE_DIR:-\$HOME/nilovcatering.ru/public_html}/config ${REMOTE_DIR:-\$HOME/nilovcatering.ru/public_html}/server-data"

          # 2) Собираем PHP-файл локально (формат ключей = secrets.example.php).
          secrets_tmp="$(mktemp)"
          chmod 600 "$secrets_tmp"
          trap 'rm -f "$secrets_tmp"' EXIT
          {
            printf '<?php\n'
            printf '// c95: файл создаёт CI из GitHub Secrets. НЕ коммитить и не редактировать руками.\n'
            printf '// Формат ключей: public/config/secrets.example.php\n'
            printf 'return [\n'
            printf "    'gh_token' => '%s',\n" "$ADMIN_GH_TOKEN"
            printf "    'gh_repo' => '9xj89gzrtw-hue/newsite',\n"
            printf "    'gh_path' => 'src/data/menu.json',\n"
            printf "    'hmac_key' => '%s',\n" "$ADMIN_HMAC_KEY"
            printf "    'password_hash_default' => '%s',\n" "$ADMIN_PASSWORD_HASH"
            printf "    'tg_api_base' => 'https://api.telegram.org',\n"
            printf "    'notify_from' => 'noreply@nilovcatering.ru',\n"
            printf '];\n'
          } > "$secrets_tmp"

          # 3) Загружаем rsync-ом — те же ssh-опции и семантика «~» в REMOTE_DIR,
          #    что и в основном деплое (у scp/SFTP свои правила путей).
          sshpass -e rsync -az \
            -e "ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p ${SSH_PORT:-22}" \
            "$secrets_tmp" "$SSH_USER@$SSH_HOST:${REMOTE_DIR:-~/nilovcatering.ru/public_html}/config/secrets.php"

          # 4) Best-effort проверка синтаксиса на хостинге: php CLI может быть
          #    недоступен в неинтерактивном ssh — это НЕ ошибка деплоя.
          if ! sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
              "php -l '${REMOTE_DIR:-\$HOME/nilovcatering.ru/public_html}/config/secrets.php'"; then
            echo "::warning::php -l для config/secrets.php не выполнен (нет php CLI или синтаксис битый) — проверьте файл на хостинге"
          fi

      # c95: смоук-тест живости PHP после деплоя. GET на POST-only эндпоинт
      # обязан вернуть 405 — значит Apache исполняет lead.php, а не отдаёт
      # файл статикой. Предупреждение (не фейл), чтобы не блокировать релиз.
      - name: Verify admin API on production (non-fatal)
        run: |
          code=000
          for i in 1 2 3; do
            if [ "$i" -gt 1 ]; then sleep 10; fi
            if code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://nilovcatering.ru/api/lead.php)"; then
              if [ "$code" = "405" ]; then
                break
              fi
            fi
          done
          if [ "$code" = "405" ]; then
            echo "API OK: GET /api/lead.php → 405 (POST only), attempt $i/3"
          else
            echo "::warning::GET https://nilovcatering.ru/api/lead.php → HTTP ${code} (ожидался 405). Проверьте PHP/деплой вручную — деплой НЕ прерван."
          fi

      # c101 (чек-лист SEO-YANDEX, шаг 28): IndexNow — Яндекс и Bing одним
      # ключом. Ключ-файл public/<key>.txt едет со статикой (rsync из out/),
      # уже лежит на хостинге к этому шагу. Сначала проверяем его живость
      # по https, затем пингуем ОБЩИЙ эндпоинт api.indexnow.org — он
      # раскидывает URL по всем участникам протокола (Яндекс, Bing, Seznam).
      # Non-fatal: IndexNow лишь ускоряет переобход, деплой он не ломает.
      - name: IndexNow ping (non-fatal)
        run: |
          set -uo pipefail
          KEY_FILE="public/4455bbdfdb43656d43eeae6d6e0241c8.txt"
          KEY="$(tr -d '[:space:]' < "$KEY_FILE")"
          KEY_URL="https://nilovcatering.ru/${KEY_FILE#public/}"
          live=""
          for i in 1 2 3; do
            live="$(curl -sS --max-time 15 "$KEY_URL" 2>/dev/null || true)"
            if [ "$live" = "$KEY" ]; then break; fi
            sleep 5
          done
          if [ "$live" != "$KEY" ]; then
            echo "::warning::IndexNow ключ-файл недоступен ($KEY_URL) — пинг пропущен, деплой НЕ прерван"
            exit 0
          fi
          echo "Key file OK: $KEY_URL"
          body="$(printf '{"host":"nilovcatering.ru","key":"%s","keyLocation":"%s","urlList":["https://nilovcatering.ru/","https://nilovcatering.ru/about","https://nilovcatering.ru/offer","https://nilovcatering.ru/privacy","https://nilovcatering.ru/terms"]}' "$KEY" "$KEY_URL")"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary "$body" \
            https://api.indexnow.org/IndexNow || echo 000)"
          case "$code" in
            200|202) echo "IndexNow OK (HTTP $code): 5 URL отправлены (Яндекс + Bing)";;
            *) echo "::warning::IndexNow ответил HTTP $code (200/202 ожидались) — не блокирует деплой";;
          esac

      - name: Done
        run: echo "Deployed to ${REMOTE_DIR:-~/nilovcatering.ru/public_html/} on nilovcatering.ru"

  # c91: второй контур деплоя — Vercel (зеркало продакшена).
  # Почему CLI, а не Git-интеграцией: Vercel Hobby БЛОКИРУЕТ автодеплои
  # от git-авторов, не привязанных к аккаунту (коммиты агента
  # «Z User <z@container>» давали BLOCKED с 16.09). CLI-деплой по токену
  # автор-агностичен. Проект уже существует: newsite (team_xVbscKLiDECkF…,
  # prj_T3MSu27oTSSutClOCMJjMtQ2tcqU), build remote по vercel.json
  # (static export, бун, env проекта: Metrika/verification добавлены c91).
  # c95: зеркало — ТОЛЬКО статика. PHP не исполняется на Vercel, поэтому
  # /api/*, /config/*, /server-data/* закрыты redirect-ами на /404 в
  # vercel.json (rewrites не годятся: у Vercel файловая система приоритетнее
  # rewrites — исходники .php иначе раздавались бы как статики).
  deploy-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy to Vercel (production)
        env:
          VERCEL_ORG_ID: team_xVbscKLiDECkF6c3izew1I3J
          VERCEL_PROJECT_ID: prj_T3MSu27oTSSutClOCMJjMtQ2tcqU
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bunx vercel deploy --prod --yes
          echo "Vercel production deployment triggered for $GITHUB_SHA"
