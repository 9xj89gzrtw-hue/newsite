name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # c95: единый источник меню/цен src/data/menu.json — тот же контракт,
      # что и в npm-скрипте build (до next build).
      - name: Validate menu data
        run: bun scripts/validate-menu.ts

      - name: Install PHP test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-curl php-mbstring

      - name: Validate PHP syntax
        run: |
          for file in public/api/*.php public/config/secrets.example.php; do
            php -l "$file" || exit 1
          done

      - name: Regression tests (isolated, notifications disabled)
        run: bun run test

      - name: Production static export
        run: bun run build

      # c95 (4-W1-D): шаг «Static data freshness (llms.txt)» УДАЛЁН —
      # публикация из админки коммитит ТОЛЬКО src/data/menu.json, а
      # деплой всё равно регенерирует public/llms.txt на сборке
      # (deploy.yml → gen-static-data.ts перед next build). Диф-гейт
      # гарантированно краснел на каждой легитимной публикации цены.
